<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>任务编排中心</title>
<script>
(function(){try{var t=localStorage.getItem('ta-theme');
if(!t)t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme='dark';}})();
window.__errs=[];
window.addEventListener('error',function(e){(window.__errs=window.__errs||[]).push('ERR: '+e.message+' @'+(e.filename||'')+':'+e.lineno);});
window.addEventListener('unhandledrejection',function(e){(window.__errs=window.__errs||[]).push('REJ: '+(e.reason&&e.reason.message||e.reason));});
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
