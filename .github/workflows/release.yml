name: Release

# push 到 main 后自动检查版本号：新版本号 → 构建 + 发布 Release；同版本重推 → 跳过
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # ---- 版本检测：新版本号才走构建与发布 ----
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要全历史才能检查 tag 是否已存在
      - name: Detect version
        id: v
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' orcsy/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/V$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag V$VERSION already exists — skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: V$VERSION"
          fi

  # ---- Windows 构建：PyInstaller + Inno Setup 安装包 + 自更新 zip ----
  build-windows:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: pwsh

      - name: Install Inno Setup 6
        run: |
          choco install innosetup -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"
        shell: pwsh


      - name: Build frontend
        run: |
          cd dashboard
          npm install --prefer-offline
          npm run build
        shell: pwsh

      - name: Generate dashboard_html.py
        run: uv run python tools/gen_page.py
        shell: pwsh

      - name: Upload dashboard_html.py for the ARM64 job
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-html
          path: orcsy/dashboard_html.py
          retention-days: 5

      - name: Build Windows artifacts
        run: |
          uv run python build/build.py --windows-only
        shell: pwsh

      - name: Validate Windows release assets
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $setup = "build/Setup/orcsy-setup-$version-windows-amd64.exe"
          $update = "build/Setup/orcsy-update-$version.zip"
          $arm64 = "build/Setup/orcsy-$version-windows-arm64.zip"
          uv run python build/verify_release.py $setup "$setup.sha256" $update "$update.sha256" $arm64 "$arm64.sha256"
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            build/Setup/orcsy-setup-*.exe
            build/Setup/orcsy-setup-*.exe.sha256
            build/Setup/orcsy-update-*.zip
            build/Setup/orcsy-update-*.zip.sha256
            build/Setup/orcsy-*-windows-arm64.zip
            build/Setup/orcsy-*-windows-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 5

  # ---- Windows ARM64 构建：PyInstaller 不支持交叉编译，必须在 ARM64 宿主执行 ----
  build-windows-arm64:
    needs: [version, build-windows]
    if: needs.version.outputs.should_release == 'true'
    runs-on: windows-11-arm
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: irm https://astral.sh/uv/install.ps1 | iex
        shell: pwsh

      - name: Install ARM64 Python and dependencies
        run: |
          uv python install 3.12
          uv sync --dev --python 3.12 --managed-python
        shell: pwsh

      - name: Verify the interpreter is ARM64
        run: |
          uv run python -c "import platform, sys; arch = platform.machine().lower(); print(sys.version); print('arch:', arch); assert arch in ('arm64', 'aarch64'), 'Python is not ARM64'"
        shell: pwsh

      - name: Reuse dashboard_html.py from the x64 build
        uses: actions/download-artifact@v4
        with:
          name: dashboard-html
          path: orcsy

      - name: Install Inno Setup 6
        run: |
          $ErrorActionPreference = "Stop"
          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco install innosetup -y --no-progress
          } else {
            $exe = Join-Path $env:TEMP "innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $exe
            # 默认安装路径即 C:\Program Files (x86)\Inno Setup 6，避免带空格参数的引用问题
            Start-Process -Wait $exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART"
          }
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"
        shell: pwsh

      - name: Build Windows ARM64 artifacts
        run: uv run python build/build.py --windows-only --arch arm64 --skip-frontend
        shell: pwsh

      - name: Validate ARM64 release assets
        run: |
          $version = '${{ needs.version.outputs.version }}'
          $setup = "build/Setup/orcsy-setup-$version-windows-arm64.exe"
          $update = "build/Setup/orcsy-update-$version-windows-arm64.zip"
          uv run python build/verify_release.py $setup "$setup.sha256" $update "$update.sha256"
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: |
            build/Setup/orcsy-setup-*-windows-arm64.exe
            build/Setup/orcsy-setup-*-windows-arm64.exe.sha256
            build/Setup/orcsy-update-*-windows-arm64.zip
            build/Setup/orcsy-update-*-windows-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 5

  # ---- Linux 构建：便携 tar.gz (amd64/arm64) + deb 桌面包 ----
  build-linux:
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install cross-compile toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf

      - name: Build frontend
        run: |
          cd dashboard
          npm install --prefer-offline
          npm run build

      - name: Generate dashboard_html.py
        run: uv run python tools/gen_page.py

      - name: Build Linux artifacts
        run: |
          uv run python build/build.py --linux-only

      - name: Validate Linux release assets
        run: |
          version='${{ needs.version.outputs.version }}'
          files=(build/Setup/orcsy-"$version"-linux-{amd64,arm64}.tar.gz build/Setup/orcsy_"$version"_{amd64,arm64}.deb)
          assets=()
          for file in "${files[@]}"; do assets+=("$file" "$file.sha256"); done
          uv run python build/verify_release.py "${assets[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            build/Setup/orcsy-*
            build/Setup/orcsy_*
          if-no-files-found: error
          retention-days: 5

  # ---- 预发布门禁：下载、校验并做 smoke；通过后自动发布 ----
  prepublish-smoke:
    needs: [version, build-windows, build-windows-arm64, build-linux]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: dist/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: dist/

      - name: Download Windows ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: dist/

      - name: Verify release artifacts before publishing
        run: |
          version='${{ needs.version.outputs.version }}'
          files=(dist/orcsy-setup-"$version"-windows-amd64.exe
                 dist/orcsy-setup-"$version"-windows-arm64.exe
                 dist/orcsy-update-"$version".zip
                 dist/orcsy-update-"$version"-windows-arm64.zip
                 dist/orcsy-"$version"-windows-arm64.zip
                 dist/orcsy-"$version"-linux-{amd64,arm64}.tar.gz
                 dist/orcsy_"$version"_{amd64,arm64}.deb)
          assets=()
          for file in "${files[@]}"; do assets+=("$file" "$file.sha256"); done
          python3 build/verify_release.py "${assets[@]}"
          shopt -s nullglob
          actual=(dist/orcsy-* dist/orcsy_*)
          if [ "${#actual[@]}" -ne "${#assets[@]}" ]; then
            echo "Unexpected or missing release assets" >&2
            exit 1
          fi
          if [ -z "$(awk -v ver="$version" '$0 ~ "^## \\[" ver "\\]" {print; exit}' CHANGELOG.md)" ]; then
            echo "Missing CHANGELOG entry for $version" >&2
            exit 1
          fi

      - name: Smoke Linux tarball CLI
        run: |
          version='${{ needs.version.outputs.version }}'
          workdir="$(mktemp -d)"
          tar -xzf "dist/orcsy-$version-linux-amd64.tar.gz" -C "$workdir"
          root=$(find "$workdir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          test -n "$root"
          # 启动器文件与包目录同名会让 tar 解包失败（orcsy 文件 vs orcsy/ 目录）
          test -x "$root/orcsy.sh"
          test -f "$root/orcsy/tools.py"
          python3 -m compileall -q "$root"
          python3 -m pip install --quiet --target "$workdir/deps" "$root"
          PYTHONPATH="$workdir/deps" python3 -m orcsy --version

      - name: Smoke package contents without network or publishing
        run: |
          version='${{ needs.version.outputs.version }}'
          unzip -Z1 "dist/orcsy-update-$version.zip" | grep -Fx 'orcsy-web.exe'
          unzip -Z1 "dist/orcsy-update-$version.zip" | grep -Fx 'orcsy-tray.exe'
          unzip -Z1 "dist/orcsy-update-$version-windows-arm64.zip" | grep -Fx 'orcsy-web.exe'
          unzip -Z1 "dist/orcsy-update-$version-windows-arm64.zip" | grep -Fx 'orcsy-tray.exe'
          unzip -Z1 "dist/orcsy-$version-windows-arm64.zip" | grep -Fx "orcsy-$version-windows-arm64/orcsy.bat"
          unzip -Z1 "dist/orcsy-$version-windows-arm64.zip" | grep -Fx "orcsy-$version-windows-arm64/pyproject.toml"
          tar -tzf "dist/orcsy-$version-linux-arm64.tar.gz" | grep -Fx "orcsy-$version-linux-arm64/orcsy.sh"
          tar -tzf "dist/orcsy-$version-linux-arm64.tar.gz" | grep -Fx "orcsy-$version-linux-arm64/orcsy/tools.py"
          dpkg-deb -c "dist/orcsy_$version_amd64.deb" | grep -E "opt/orcsy/orcsy$"
          dpkg-deb -c "dist/orcsy_$version_amd64.deb" | grep -E "opt/orcsy/tools.py$"

      - name: Upload checked artifacts for release
        uses: actions/upload-artifact@v4
        with:
          name: checked-release-artifacts
          path: dist/
          if-no-files-found: error
          retention-days: 5

  # ---- 发布：创建 tag + GitHub Release（CHANGELOG 摘录 + 全部附件 + sha256）----
  release:
    needs: [version, prepublish-smoke]
    if: needs.version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download checked artifacts
        uses: actions/download-artifact@v4
        with:
          name: checked-release-artifacts
          path: dist/

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md)
          echo "$NOTES" > release_notes.md
          printf '\nWindows packages are unsigned. SHA256 checks integrity, not publisher identity.\n' >> release_notes.md
          echo "Extracted notes: $(wc -l < release_notes.md) lines"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ needs.version.outputs.version }}
          name: V${{ needs.version.outputs.version }}：Orcsy
          body_path: release_notes.md
          files: |
            dist/orcsy-*
            dist/orcsy_*
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, 'rc') || contains(needs.version.outputs.version, 'b') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
