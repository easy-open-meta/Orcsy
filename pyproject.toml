[project]
name = "orcsy"
version = "0.23.0"
description = "项目任务编排系统：定时扫描各项目任务列表，由接入大模型的 Agent 按优先级完成功能开发与 bug 修复"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["agent", "llm", "orchestration", "automation", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "PyYAML>=6.0",
    "websockets>=12.0",
]

[project.scripts]
orcsy = "orcsy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orcsy"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "e2e_*.py"]
python_functions = ["test_*", "check_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # Line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# 内嵌 JS 载荷：空行缩进属字符串内容，strip 会改动随包分发的 JS 字节
"orcsy/browser/page_script.py" = ["W293"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false


