[project]
name = "orcsy"
version = "0.11.0"
description = "项目任务编排系统：定时扫描各项目任务列表，由接入大模型的 Agent 按优先级完成功能开发与 bug 修复"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "PyYAML>=6.0",
]

[project.scripts]
orcsy = "orcsy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orcsy"]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pyinstaller>=6.22.3",
]
